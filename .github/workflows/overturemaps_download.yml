name: Integration Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install overturemaps package
      run: |
        python -m pip install --upgrade pip
        pip install overturemaps

    - name: Install local package dependencies
      run: |
        pip install -e .

    - name: Download Overture data
      run: |
        python -m overturemaps download \
          --bbox=-77.028151,38.887626,-77.005835,38.898414 \
          -f geojson \
          --type=place \
          -o dc.geojson

    - name: Verify download
      run: |
        ls -la dc.geojson
        head -n 10 dc.geojson

    - name: Process with overturetoosm
      run: |
        python -m overturetoosm place \
          -i dc.geojson \
          --in-place \
          --confidence 0.9

    - name: Verify processing
      run: |
        echo "Processed file contents (first 20 lines):"
        head -n 20 dc.geojson

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: processed-geojson
        path: dc.geojson
        retention-days: 2
